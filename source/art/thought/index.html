<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随笔 | 生活札记</title>
<link rel="stylesheet" href="/art/css/style.css">
<style>
.main-container {
  width: 100%;
  max-width: 1200px;
  margin: 40px auto 0;
}
.tag-bar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin:16px 0 32px;
}
.tag-btn{
  padding:6px 14px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.12);
  background:transparent;
  color:var(--text-weak);
  cursor:pointer;
  transition:0.2s;
}
.tag-btn.active{
  background:rgba(120,255,180,0.15);
  border-color:rgba(120,255,180,0.35);
  color:#89ffbc;
}
.tag-btn:hover{
  border-color:rgba(255,255,255,0.25);
}
.thought-list {
  display: flex;
  flex-direction: column;
  gap: 32px;
}
.thought-card {
  position: relative;
  width: 100%;
  min-height: 320px;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  /* 修复弹窗裁切：不要在卡片使用transform，改用margin模拟上浮，避免合成层bug */
  transition: margin 0.3s ease, box-shadow 0.3s ease;
  margin-top:0;
  margin-bottom:0;
  z-index:1;
}
.thought-card.hidden{
  display:none;
}
.thought-card:hover {
  /* ❗重点：弃用transform:translateY，改用margin，彻底解决overflow:hidden带来的渲染层裁切弹窗bug */
  margin-top: -4px;
  margin-bottom:4px;
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
}
.thought-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  z-index: 0;
}
.thought-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    to right,
    rgba(0, 0, 0, 0.82) 0%,
    rgba(0, 0, 0, 0.55) 45%,
    rgba(0, 0, 0, 0.35) 70%,
    rgba(0, 0, 0, 0.15) 100%
  );
  z-index: 1;
}
.thought-card:nth-child(even) .thought-overlay {
  background: linear-gradient(
    to left,
    rgba(0, 0, 0, 0.82) 0%,
    rgba(0, 0, 0, 0.55) 45%,
    rgba(0, 0, 0, 0.35) 70%,
    rgba(0, 0, 0, 0.15) 100%
  );
}
.thought-text {
  position: relative;
  z-index: 2;
  width: 48%;
  height: 100%;
  padding: 32px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.thought-card:nth-child(odd) .thought-text {
  margin-left: 0;
  margin-right: auto;
}
.thought-card:nth-child(even) .thought-text {
  margin-left: auto;
  margin-right: 0;
  text-align: right;
}
.thought-title {
  font-size: 1.6rem;
  margin: 0 0 12px;
  color: #fff;
}
.thought-meta {
  font-size: 0.9rem;
  color: rgba(255, 255, 255, 0.65);
  margin-bottom: 16px;
}
.thought-summary {
  font-size: 1rem;
  line-height: 1.7;
  color: rgba(255, 255, 255, 0.8);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
@media (max-width: 900px) {
  .thought-card {
    min-height: 260px;
  }
  .thought-text {
    width: 100%;
    padding: 24px;
    background: rgba(0, 0, 0, 0.75);
  }
  .thought-card:nth-child(even) .thought-text {
    margin-left: 0;
    margin-right: 0;
    text-align: left;
  }
  .thought-overlay {
    display: none;
  }
}
</style>
</head>
<body>
<header class="site-header">
  <a href="/art/index.html" class="back-blog-link">← 返回生活札记首页</a>
  <div class="header-title-wrap">
    <h1 class="main-title" style="color:var(--color-thought)">随笔</h1>
    <p class="sub-title">日常随感、零散思考与生活记录</p>
  </div>
  <div class="filter-placeholder">
    <div class="tag-bar" id="tagBar"></div>
  </div>
</header>
<main class="main-container">
  <div class="thought-list" id="listWrap">
    <p class="loading-text">加载中...</p>
  </div>
</main>
<script src="/art/js/utils.js"></script>
<script>
const wrap = document.getElementById("listWrap");
const tagBar = document.getElementById("tagBar");
let allData = [];
let selectedTags = new Set();

function renderCard(item) {
  const card = document.createElement("div");
  card.className = "thought-card";
  card.dataset.tags = JSON.stringify(item.tags || []);
  card.innerHTML = `
    <div class="thought-bg" style="background-image:url('${item.cover}')"></div>
    <div class="thought-overlay"></div>
    <div class="thought-text">
      <h3 class="thought-title">${item.title}</h3>
      <p class="thought-meta">${Utils.formatDate(item.recordDate)}</p>
      ${item.summary ? `<p class="thought-summary">${item.summary}</p>` : ""}
    </div>
  `;
  card.onclick = () => Utils.openModal(item);
  return card;
}

function renderTags(){
  const tagSet = new Set();
  allData.forEach(item=>{
    (item.tags || []).forEach(t=>tagSet.add(t));
  });
  const tagList = Array.from(tagSet);
  tagBar.innerHTML = "";
  const clearBtn = document.createElement("button");
  clearBtn.className = "tag-btn";
  clearBtn.innerText = "全部";
  clearBtn.onclick = ()=>{
    selectedTags.clear();
    refreshFilter();
  };
  tagBar.appendChild(clearBtn);
  tagList.forEach(tag=>{
    const btn = document.createElement("button");
    btn.className = "tag-btn";
    btn.innerText = tag;
    btn.onclick = ()=>{
      if(selectedTags.has(tag)) selectedTags.delete(tag);
      else selectedTags.add(tag);
      refreshFilter();
    };
    tagBar.appendChild(btn);
  });
  refreshFilter();
}

function refreshFilter(){
  const cards = wrap.querySelectorAll(".thought-card");
  document.querySelectorAll(".tag-btn").forEach(btn=>{
    //修复全部按钮高亮
    if(btn.innerText === "全部"){
      btn.classList.toggle("active", selectedTags.size === 0);
    }else{
      btn.classList.toggle("active", selectedTags.has(btn.innerText));
    }
  });
  cards.forEach(card=>{
    const cardTags = JSON.parse(card.dataset.tags);
    if(selectedTags.size === 0){
      card.classList.remove("hidden");
    }else{
      const match = [...selectedTags].some(t=>cardTags.includes(t));
      card.classList.toggle("hidden", !match);
    }
  });
}

document.addEventListener("DOMContentLoaded", async () => {
  // ✅修复路径！data目录下的thoughts.json
  allData = await Utils.loadJson("thoughts.json");
  wrap.innerHTML = "";
  if (allData.length === 0) {
    wrap.innerHTML = "<p class='empty-tip'>暂无随笔记录</p>";
    return;
  }
  allData.forEach(item => wrap.appendChild(renderCard(item)));
  renderTags();
});
</script>
</body>
</html>
