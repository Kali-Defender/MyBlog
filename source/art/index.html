<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生活札记 | 观影 | 听乐 | 读书 | 随笔</title>
<link rel="stylesheet" href="./css/style.css">
<style>
.plate-nav-wrap {
  width: 100%;
  max-width: 1200px;
  margin: 60px auto 0;
}
.plate-scroll-wrapper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 36px 32px;
  overflow: visible;
}
.plate-card {
  display: block;
  /* 固定最小高度，彻底杜绝高度不一致导致的重叠 */
  min-height: 240px;
  padding: 28px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.08);
  /* 核心：背景图配置 + 深色渐变遮罩，保证文字可读 */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-blend-mode: multiply;
  background-color: rgba(0,0,0,0.55);
  transition: all 0.26s ease;
  position: relative;
}
.plate-card::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:16px;
  background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.15) 45%);
  pointer-events:none;
}
.plate-card:hover {
  transform: translateY(-6px);
  border-color: rgba(255,255,255,0.16);
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}
/* 文字提升层级，浮在背景上方 */
.plate-card-text{
  position:relative;
  z-index:2;
}
.plate-name {
  font-size: 1.6rem;
  margin:0 0 8px;
}
.plate-desc {
  color: var(--text-weak);
  font-size:0.92rem;
  line-height:1.6;
}
.name-movie { color: var(--color-movie); }
.name-music { color: var(--color-music); }
.name-book { color: var(--color-book); }
.name-thought { color: var(--color-thought); }

@media (max-width: 680px) {
  .plate-scroll-wrapper {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<header class="site-header">
  <a href="/" class="back-blog-link">← 返回博客首页（技术札记）</a>
  <div class="header-title-wrap">
    <h1 class="main-title">生活札记</h1>
    <p class="sub-title">观影 | 听乐 | 读书 | 随笔</p>
  </div>
</header>

<main class="main-container">
  <section class="plate-nav-wrap">
    <div class="plate-scroll-wrapper">
      <!-- 影视馆 -->
      <a href="./movie/index.html" class="plate-card" style="background-image: url('./img/bg-movie.jpg');">
        <div class="plate-card-text">
          <h2 class="plate-name name-movie">影视馆</h2>
          <p class="plate-desc">院线电影、连续剧观影记录与影评</p>
        </div>
      </a>
      <!-- 音乐馆 -->
      <a href="./music/index.html" class="plate-card" style="background-image: url('./img/bg-music.jpg');">
        <div class="plate-card-text">
          <h2 class="plate-name name-music">音乐馆</h2>
          <p class="plate-desc">单曲、专辑聆听，内嵌B站音频试听</p>
        </div>
      </a>
      <!-- 书籍馆 -->
      <a href="./book/index.html" class="plate-card" style="background-image: url('./img/bg-book.jpg');">
        <div class="plate-card-text">
          <h2 class="plate-name name-book">书籍馆</h2>
          <p class="plate-desc">实体/电子书阅读记录与读后感</p>
        </div>
      </a>
      <!-- 随笔 -->
      <a href="./thought/index.html" class="plate-card" style="background-image: url('./img/bg-thought.jpg');">
        <div class="plate-card-text">
          <h2 class="plate-name name-thought">随笔</h2>
          <p class="plate-desc">日常感悟、碎片化灵感与情绪记录</p>
        </div>
      </a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p class="update-tip"></p>
</footer>

<script src="./js/utils.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const footerTip = document.querySelector('.update-tip');
});
</script>
</body>
</html>
