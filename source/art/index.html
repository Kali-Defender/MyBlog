<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活札记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 自定义滚动条 */
        ::-webkit-scrollbar{
            width:6px;
            height:6px;
        }
        ::-webkit-scrollbar-track{
            background:#191929;
        }
        ::-webkit-scrollbar-thumb{
            background:rgba(255,255,255,0.18);
            border-radius:3px;
        }
        ::-webkit-scrollbar-thumb:hover{
            background:rgba(255,255,255,0.3);
        }
        body {
            background-color: #14141f;
            color: #eeeeee;
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 24px;
        }
        .page-header {
            margin-bottom: 36px;
        }
        .back-link {
            font-size: 14px;
            opacity: 0.75;
            color: #cccccc;
            text-decoration: none;
            transition: all 0.24s ease;
        }
        .back-link:hover {
            text-decoration: underline;
            padding-left:4px;
        }
        .page-header h1 {
            margin: 12px 0 8px;
            font-size: 34px;
        }
        .sub-title {
            opacity: 0.72;
            font-size: 16px;
        }
        .life-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px;
        }
        .life-card {
            display: block;
            height: 320px;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.08);
            text-decoration: none;
            color: #fff;
        }
        .life-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }
        .card-bg {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.35s ease;
        }
        .life-card:hover .card-bg{
            transform: scale(1.06);
        }
        .card-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.25);
        }
        .card-desc {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 24px;
            backdrop-filter: blur(10px);
        }
        .card-desc h3 {
            font-size: 22px;
            margin: 0 0 6px;
        }
        .card-desc p {
            opacity: 0.78;
            font-size: 14px;
            margin: 0;
        }
        @media (max-width: 768px) {
            .life-container {
                grid-template-columns: 1fr;
            }
            .life-card {
                height: 260px;
            }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <a href="/" class="back-link">← 返回博客首页（技术札记）</a>
        <h1>生活札记</h1>
        <p class="sub-title">观影 · 听乐 · 读书 · 随笔</p>
    </div>

    <div class="life-container">
        <a href="/art/movie/" class="life-card">
            <div class="card-bg" style="background-image:url('img/bg-movie.jpg')"></div>
            <div class="card-desc" style="background:rgba(178, 136, 255,0.12);border-top:1px solid rgba(178, 136, 255,0.25)">
                <h3>影视馆</h3>
                <p>院线电影、连续剧观影记录与影评</p>
            </div>
        </a>

        <a href="/art/music/" class="life-card">
            <div class="card-bg" style="background-image:url('img/bg-music.jpg')"></div>
            <div class="card-desc" style="background:rgba(119, 184, 255,0.12);border-top:1px solid rgba(119, 184, 255,0.25)">
                <h3>音乐馆</h3>
                <p>单曲、专辑聆听，内嵌B站音频试听</p>
            </div>
        </a>

        <a href="/art/book/" class="life-card">
            <div class="card-bg" style="background-image:url('img/bg-book.jpg')"></div>
            <div class="card-desc" style="background:rgba(106, 168, 137,0.12);border-top:1px solid rgba(134, 193, 163,0.25)">
                <h3>书籍馆</h3>
                <p>实体/电子书阅读记录与读后感</p>
            </div>
        </a>

        <a href="/art/thought/" class="life-card">
            <div class="card-bg" style="background-image:url('img/bg-thought.jpg')"></div>
            <div class="card-desc" style="background:rgba(232, 120, 112,0.12);border-top:1px solid rgba(232, 120, 112,0.25)">
                <h3>随笔</h3>
                <p>日常感悟、碎片化灵感与情绪记录</p>
            </div>
        </a>
    </div>
</body>
</html>
